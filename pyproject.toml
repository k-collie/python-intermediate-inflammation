[project]
name = "inflammation"
version = "0.1.0"
description = "Analyse patient inflammation data"
authors = [{ name = "Kristian Zarębski", email = "kristian.zarebski@ukaea.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy (>=2.5.5,<3.0.0)", "matplotlib (>=3.11.2,<4.0.0)"]

[dependency-groups]
dev = ["pytest (>=9.2.0,<10.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
